name: Build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk SideLoader.apk
      - uses: actions/upload-artifact@v4
        with: { name: SideLoader, path: SideLoader.apk }
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SideLoader.apk \
            --target "$GITHUB_SHA" \
            --title "SideLoader" \
            --notes "Latest build from main (${GITHUB_SHA::7})"
